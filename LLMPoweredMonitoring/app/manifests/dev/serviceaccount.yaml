apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-powered-monitoring-sa
  namespace: llm-powered-monitoring-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: llm-powered-monitoring-role-dev
rules:
# Core resources - reading for analysis and creating for exporters
- apiGroups: [""]
  resources: ["namespaces", "services", "pods", "endpoints", "configmaps", "secrets", "serviceaccounts"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# App resources - for deploying exporter deployments/daemonsets
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Networking - for exporter services and ingresses
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# RBAC - exporters often need their own service accounts and roles
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# CRDs - for installing custom resource definitions
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Monitoring CRDs - if installing Prometheus Operator CRDs
- apiGroups: ["azmonitoring.coreos.com"]
  resources: ["servicemonitors", "prometheusrules", "podmonitors", "probes"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Policy resources - some exporters need PodSecurityPolicies or PodDisruptionBudgets
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets", "podsecuritypolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Admission controllers - some helm charts create ValidatingWebhookConfigurations
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# For pod proxy access (checking exporter metrics endpoints)
- apiGroups: [""]
  resources: ["pods/proxy"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: llm-powered-monitoring-binding-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: llm-powered-monitoring-role-dev
subjects:
- kind: ServiceAccount
  name: llm-powered-monitoring-sa
  namespace: llm-powered-monitoring-dev
