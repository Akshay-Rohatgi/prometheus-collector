apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm.fullname" . }}
  namespace: {{ .Values.namespace.name | default .Release.Namespace }}
  labels:
    {{- include "llm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "llm.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "llm.fullname" . }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
      - name: {{ include "llm.fullname" . }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        {{- range $k, $v := .Values.env }}
        - name: {{ $k }}
          value: "{{ $v }}"
        {{- end }}
        {{- if .Values.config.models }}
        {{- range $k, $v := .Values.config.models }}
        - name: {{ $k }}
          value: "{{ $v }}"
        {{- end }}
        {{- end }}
        {{- if .Values.config.parameters }}
        {{- range $k, $v := .Values.config.parameters }}
        - name: {{ $k }}
          value: "{{ $v }}"
        {{- end }}
        {{- end }}
        {{- if .Values.config.workflow }}
        - name: MAX_WORKFLOWS
          value: "{{ .Values.config.workflow.maxWorkflows }}"
        - name: WORKFLOW_TTL_COMPLETED
          value: "{{ .Values.config.workflow.ttlCompleted }}"
        - name: WORKFLOW_TTL_FAILED
          value: "{{ .Values.config.workflow.ttlFailed }}"
        - name: WORKFLOW_TTL_CANCELLED
          value: "{{ .Values.config.workflow.ttlCancelled }}"
        - name: WORKFLOW_INACTIVE_TTL
          value: "{{ .Values.config.workflow.inactiveTtl }}"
        - name: WORKFLOW_CLEANUP_INTERVAL
          value: "{{ .Values.config.workflow.cleanupInterval }}"
        - name: EVICTION_POLICY
          value: "{{ .Values.config.workflow.evictionPolicy }}"
        {{- end }}
        volumeMounts:
        {{- range .Values.volumeMounts }}
        - name: {{ .name }}
          mountPath: {{ .mountPath }}
          {{- if .readOnly }}
          readOnly: true
          {{- end }}
        {{- end }}
        {{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
        {{- if .Values.probes.liveness.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.probes.liveness.path }}
            port: 8000
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
        {{- end }}
        {{- if .Values.probes.readiness.enabled }}
        readinessProbe:
          httpGet:
            path: {{ .Values.probes.readiness.path }}
            port: 8000
          initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
        {{- end }}
      volumes:
      {{- range .Values.volumes }}
      - name: {{ .name }}
        secret:
          secretName: {{ .secretName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
