namespace:
  create: true
  name: llm-powered-monitoring

image:
  repository: mcr.microsoft.com/azuremonitor/containerinsights/cidev/prometheus-collector/images
  tag: llm-powered-monitoring-7
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  name: llm-powered-monitoring-sa

rbac:
  create: true

service:
  enabled: true
  name: llm-powered-monitoring-service
  type: ClusterIP
  port: 8000
  targetPort: 8000

env:
  HOST: "0.0.0.0"
  PORT: "8000"
  LOG_LEVEL: "INFO"

# Model configuration - Azure OpenAI model deployment names
config:
  models:
    AZURE_DEPLOYMENT_4O: "gpt-4o"
    AZURE_DEPLOYMENT_5: "gpt-5"
    AZURE_DEPLOYMENT_O3: "o3"
    AZURE_DEPLOYMENT_41: "gpt-4.1"
    AZURE_API_VERSION: "2024-12-01-preview"
  # Model-specific parameters
  parameters:
    AZURE_TEMPERATURE_4O: "0.3"
    AZURE_TEMPERATURE_41: "0.3"
    AZURE_REASONING_EFFORT_5: "minimal"

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

probes:
  liveness:
    enabled: false
    path: /
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    enabled: false
    path: /
    initialDelaySeconds: 5
    periodSeconds: 5

secrets:
  openai:
    create: false
    name: openai-secrets
    data: {}
    # Example:
    # data:
    #   OPENAI_KEY: "your-azure-openai-api-key"
    #   OPENAI_ENDPOINT: "https://your-resource.openai.azure.com/"
  github:
    create: false
    name: github-secrets
    data: {}
    # Example:
    # data:
    #   GITHUB_TOKEN: "your-github-token"
    #   GITHUB_USER: "your-github-username"

volumeMounts:
  - name: openai-secrets
    mountPath: /app/ai/env
    readOnly: true
  - name: github-secrets
    mountPath: /app/ai/utils/env
    readOnly: true

volumes:
  - name: openai-secrets
    secretName: openai-secrets
  - name: github-secrets
    secretName: github-secrets

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}
